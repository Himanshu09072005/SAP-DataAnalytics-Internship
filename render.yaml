services:
  - type: web
    name: sap-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd Project && pip install -r requirements.txt
    startCommand: |
      cd Project && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sap-backend.onrender.com
        preview: https://sap-backend.onrender.com
        required: true

  - type: static
    name: sap-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: |
      cd Frontend && npm install && npm run build
    staticPublishPath: Frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService: sap-backend
        value: https://sap-backend.onrender.com
        preview: https://sap-backend.onrender.com
        required: true

