services:
  - type: web
    name: sap-backend
    env: python
    region: oregon
    plan: free
    buildCommand: cd Project && pip install -r requirements.txt
    startCommand: cd Project && uvicorn app.main:app --host 0.0.0.0 --port $PORT

  - type: web
    name: sap-frontend
    env: static
    buildCommand: cd Frontend && npm install && npm run build
    staticPublishPath: Frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sap-backend.onrender.com
